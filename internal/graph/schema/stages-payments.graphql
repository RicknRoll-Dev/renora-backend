extend type Query {
  """
  Renora's fees, for pages with no job in scope: pricing, sign-up, a shop's welcome. A job keeps the terms
  it was agreed on (`Job.fees`); a shop its own (`Shop.fee`).
  """
  feePolicy: FeePolicy! @public
}

type FeePolicy {
  protection: ProtectionFeeRule!
  changeOrders: ChangeOrderFeeRule!
  match: MatchFeeRule!
  shop: ShopFeeRule!
}

type ProtectionFeeRule {
  rate: Bps!
  minPerJob: Money!
  capPerJob: Money!
  includesPpn: Boolean!
}

type MatchFeeRule {
  rate: Bps!
  cap: Money!
  "Founding contractors pay no match fee until this day."
  waivedUntil: Date
}

type ShopFeeRule {
  "Of delivered goods."
  commission: Bps!
  "A new shop's first orders carry no commission."
  freeOrders: Int!
  rateLockedUntil: Date!
}
