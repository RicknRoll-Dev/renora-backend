name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The vendored schema (internal/graph/schema) must match the contract. The
  # contract is checked out beside this repo, as the web and mobile apps do it,
  # with a read-only deploy key. Pin `ref` to a branch to build against a
  # contract change before it merges.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: renora
      - uses: actions/checkout@v5
        with:
          repository: RicknRoll-Dev/renora-api-contract
          ssh-key: ${{ secrets.CONTRACT_DEPLOY_KEY }}
          path: renora-api-contract
      - name: Vendored schema matches the contract
        working-directory: renora
        run: |
          make check-contract || {
            echo "::error::internal/graph/schema differs from the contract. Run 'make contract-sync generate' and commit."
            exit 1
          }

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: renora
          POSTGRES_PASSWORD: renora
          POSTGRES_DB: renora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U renora -d renora_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Generated code is up to date
        run: |
          go tool gqlgen generate
          git diff --exit-code -- internal/graph
      - run: go vet ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://renora:renora@localhost:5432/renora_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  image:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg VERSION=${{ github.sha }} --build-arg COMMIT=${{ github.sha }} -t renora/renora-api:ci .
