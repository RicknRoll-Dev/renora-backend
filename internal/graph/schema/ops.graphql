extend type Query {
  opsOverview: OpsOverview! @allow(roles: [ops])
  "Every running clock, soonest first."
  opsClocks(kind: ClockKind, first: Int = 50, after: String): ClockConnection! @allow(roles: [ops])
  cases(status: CaseFilter = all, assigneeId: ID, first: Int = 20, after: String): CaseConnection!
    @allow(roles: [ops])
  "A case by its id or its issue's id."
  case(id: ID!): Case @allow(roles: [ops])
  """
  Money movements at the partner so far, newest first; `date` is a WIB calendar day. The word \"escrow\" is
  allowed on ops screens only.
  """
  ledger(date: Date, first: Int = 50, after: String): LedgerEntryConnection! @allow(roles: [ops])
  """
  The day's reconciliation (default today, on the server's clock), for any day up to today, built from the
  same movements as `ledger`: `ledger` (in escrow) is the sum of `holdAges`, `opening` is the previous day's
  close, and `partnerStatement` is the opening plus what came in, less what was sent. `matched` only when
  the two agree (`difference` 0). Null for a day after today.
  """
  reconciliation(date: Date): Reconciliation @allow(roles: [ops])
  payoutInstructions(
    status: PayoutStatus
    first: Int = 50
    after: String
  ): PayoutInstructionConnection! @allow(roles: [ops])
  verificationQueue(
    status: VerificationCaseStatus
    first: Int = 20
    after: String
  ): VerificationCaseConnection! @allow(roles: [ops])
  verificationCase(id: ID!): VerificationCase @allow(roles: [ops])
  opsUsers(role: AccountRole, q: String, first: Int = 20, after: String): OpsUserConnection!
    @allow(roles: [ops])
  opsUser(id: ID!): OpsUser @allow(roles: [ops])
  "The full record of one job, with its hash chain checked."
  jobInspection(jobId: ID!): JobInspection @allow(roles: [ops])
  jobEvents(jobId: ID!, first: Int = 50, after: String): JobEventConnection! @allow(roles: [ops])
  "Where code changed or blocked AI output."
  aiGuardEvents(
    feature: AiFeature
    guard: AiGuard
    first: Int = 50
    after: String
  ): AiGuardEventConnection! @allow(roles: [ops])
  aiGuardStatus: AiGuardStatus! @allow(roles: [ops])
  supportTickets(
    status: TicketStatus
    mine: Boolean
    first: Int = 20
    after: String
  ): SupportTicketConnection! @allow(roles: [ops])
  supportTicket(id: ID!): SupportTicket @allow(roles: [ops])
  cannedAnswers: [CannedAnswer!]! @allow(roles: [ops])
  "Staff accounts, for assigning cases and tickets."
  opsStaff: [StaffMember!]! @allow(roles: [ops])
}

extend type Mutation {
  "Every view and action in the console is logged with who and when."
  assignCase(input: AssignCaseInput!): AssignCaseResult! @allow(roles: [ops])
  """
  The mediator's suggestion (fix by a date, partial or full release, refund), with who and when. `sent` puts
  it to both sides: the issue becomes `suggested` and nothing moves until both accept
  (`answerMediatorSuggestion`). Once either side declines, the issue is back with the mediator and a new
  suggestion can be sent. Problems: `already_sent`, `invalid_input`.
  """
  decideCase(input: DecideCaseInput!): DecideCaseResult! @allow(roles: [ops])
  "Only a failed or retrying instruction. Problems: `not_retryable`."
  retryPayoutInstruction(input: RetryPayoutInstructionInput!): RetryPayoutInstructionResult!
    @allow(roles: [ops])
  """
  Approve, or ask for a new photo with a reason. Approving unlocks payouts, so it needs an uploaded document
  and a compared field, none of which `differs`. Problems: `invalid_input` (`reason` when asking again;
  `approve` with reason `document_missing`, `nothing_compared` or `field_differs`).
  """
  decideVerification(input: DecideVerificationInput!): DecideVerificationResult!
    @allow(roles: [ops])
  requestReverification(input: RequestReverificationInput!): RequestReverificationResult!
    @allow(roles: [ops])
  updateSupportTicket(input: UpdateSupportTicketInput!): SupportTicketResult! @allow(roles: [ops])
  replyToSupportTicket(input: ReplyToSupportTicketInput!): SupportTicketResult! @allow(roles: [ops])
}

