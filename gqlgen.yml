# The schema is the contract's, vendored by `make contract-sync`. Never edit it here.
schema:
  - internal/graph/schema/*.graphql

exec:
  layout: follow-schema
  dir: internal/graph/generated
  package: generated

model:
  filename: internal/graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph
  filename_template: "{name}.resolvers.go"
  omit_template_comment: true

omit_gqlgen_file_notice: false
omit_getters: true
omit_slice_element_pointers: true
call_argument_directives_with_null: true

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Money:
    model:
      - github.com/renora/renora-api/internal/graph/scalar.Money
  Bps:
    model:
      - github.com/renora/renora-api/internal/graph/scalar.Bps
  DateTime:
    model:
      - github.com/renora/renora-api/internal/graph/scalar.DateTime
  Date:
    model:
      - github.com/renora/renora-api/internal/graph/scalar.Date
  # Hand-written so that Me's fields beyond the account itself get resolvers.
  Me:
    model:
      - github.com/renora/renora-api/internal/graph/model.Me
