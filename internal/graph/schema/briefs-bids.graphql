extend type Query {
  "The changes she can tick for a room type, in the reader's language."
  changeOptions(roomType: RoomType!): [ChangeOption!]! @public
  "Areas a contractor may serve, nearest first, within `withinKm` of a point (his base or a pin)."
  areaSuggestions(near: GeoPointInput!, withinKm: Float = 10): [String!]! @public
  "The owner's briefs (P4)."
  briefs: [Brief!]! @allow(roles: [owner])
  brief(id: ID!): Brief @allow(roles: [owner, ops])
  "Real photos from verified handovers."
  moodBoards(roomType: RoomType): [MoodBoard!]!
  "The contractor's invitations to quote."
  bidInvites(first: Int = 20, after: String): BidInviteConnection! @allow(roles: [contractor])
  bidInvite(id: ID!): BidInvite
  """
  A bid. Bids are sealed: the bidder reads his own; the owner reads it once sent; no contractor ever reads
  another's.
  """
  bid(id: ID!): Bid
}

extend type Mutation {
  """
  Works without a session: the payload carries a `draftToken` for later edits and `claimBrief`. Problems:
  `invalid_input` (`budgetBand`, `band_rules`).
  """
  createBrief(input: BriefInput!): CreateBriefResult! @public
  """
  With a session (the owner) or the anonymous `draftToken`. Problems: `brief_published`, `invalid_input`
  (`budgetBand`, `band_rules`: the band rules on `BudgetBand`).
  """
  updateBrief(input: UpdateBriefInput!): UpdateBriefResult! @public
  "Saves an anonymous draft to the signed-in owner's account."
  claimBrief(input: ClaimBriefInput!): ClaimBriefResult! @allow(roles: [owner])
  "The AI drafts the work list from the photos, the changes and the voice note (R1: each line is a suggestion)."
  suggestWorkList(input: SuggestWorkListInput!): SuggestWorkListResult! @allow(roles: [owner])
  saveWorkList(input: SaveWorkListInput!): SaveWorkListResult! @allow(roles: [owner])
  """
  An AI picture of her own room (pilot arm only, at most 3 per project). Stamped \"AI illustration · not to
  scale · not the agreed spec\"; contractors never see it. Problems: `quota_exhausted`.
  """
  generateLook(input: GenerateLookInput!): GenerateLookResult! @allow(roles: [owner])
  """
  Opens bidding for 3 days, closing at 21:00. Requires the budget band contractors see (\"a range, not a
  target\"), within the band rules against her limit as it is now. Problems: `brief_published`, `invalid_input`
  (`budgetBand`: `required`, `band_rules`).
  """
  publishBrief(input: PublishBriefInput!): PublishBriefResult! @allow(roles: [owner])
  """
  At most 3 bidding at once and 5 invites per brief; a backup waits on standby. Invitees answer within
  24 h; silence is a decline. Problems: `bidders_full`, `invites_full`.
  """
  inviteContractor(input: InviteContractorInput!): InviteContractorResult! @allow(roles: [owner])
  "Join (opens an AI-filled draft bid) or decline with a reason. Problems: `already_answered`."
  respondToBidInvite(input: RespondToBidInviteInput!): RespondToBidInviteResult!
    @allow(roles: [contractor])
  "Free to the owner; at least 24 h before bids close. No-shows on either side earn a strike."
  requestSiteVisit(input: RequestSiteVisitInput!): RequestSiteVisitResult!
    @allow(roles: [contractor])
  updateSiteVisit(input: UpdateSiteVisitInput!): UpdateSiteVisitResult!
    @allow(roles: [owner, contractor])
  "Saves the draft bid. Volume × unit price on every line; totals are recomputed by code. Problems: `bid_sent`."
  saveBid(input: SaveBidInput!): SaveBidResult! @allow(roles: [contractor])
  "Sends the sealed bid. All 8 key terms are required. Problems: `bid_sent`, `terms_missing` (invalid_input)."
  submitBid(input: SubmitBidInput!): SubmitBidResult! @allow(roles: [contractor])
  """
  Withdraws a joined invite or a sent bid while the brief is still open. The bidding rules allow it; it
  shows on his record as \"menarik diri\" (withdrew) and frees a bidder slot for the owner's backup.
  Problems: `already_chosen`, `bid_window_closed`.
  """
  withdrawBid(input: WithdrawBidInput!): WithdrawBidResult! @allow(roles: [contractor])
  """
  The owner asks all bidders (or some); every answer is shared with all of them. A bidder (who joined the
  bidding) asks the owner; her answer goes to every bidder, and other bidders never see who asked.
  """
  askBidQuestion(input: AskBidQuestionInput!): AskBidQuestionResult!
    @allow(roles: [owner, contractor])
  "A bidder answers the owner's question, or the owner answers a bidder's (`ownerAnswer`)."
  answerBidQuestion(input: AnswerBidQuestionInput!): AnswerBidQuestionResult!
    @allow(roles: [owner, contractor])
  shareBidAnswer(input: ShareBidAnswerInput!): ShareBidAnswerResult! @allow(roles: [owner])
  "The owner opened the question: every answer in so far is read (\"1 answer to read\" clears)."
  markBidQuestionRead(input: MarkBidQuestionReadInput!): MarkBidQuestionReadResult!
    @allow(roles: [owner])
  """
  The owner chooses within 7 days of the close; the others receive her reason chip, never rivals' prices.
  The chosen bid becomes the job and its agreement draft. Problems: `already_chosen`.
  """
  chooseBid(input: ChooseBidInput!): ChooseBidResult! @allow(roles: [owner])
  closeBriefWithoutChoice(input: CloseBriefInput!): CloseBriefResult! @allow(roles: [owner])
}

