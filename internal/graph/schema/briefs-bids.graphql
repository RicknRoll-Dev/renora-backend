  finishesPickedAt: DateTime
  roughBudget: RoughBudget @private(to: [owner, ops])
  looks: [Look!] @private(to: [owner, ops])
  invites: [BidInvite!]!
  "Sent bids only, most complete first (never cheapest first, R9)."
